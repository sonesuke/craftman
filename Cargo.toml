[package]
name = "craftman"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
